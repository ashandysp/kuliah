<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS - Grid Simple</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 10px;
    }

    .header {
      grid-column: 1 / 3;
      background: lightblue;
      padding: 20px;
      text-align: center;
    }

    .sidebar {
      background: lightgray;
      padding: 20px;
    }

    .content {
      background: white;
      padding: 20px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Header</div>
    <div class="sidebar">Sidebar</div>
    <div class="content">Konten Utama</div>
  </div>
</body>
</html>
