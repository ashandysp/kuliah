<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS - GRID</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 10px;
    }

    .item {
      background: orange;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Grid Kolom Fleksibel</h2>
  <div class="container">
    <div class="item">Kolom 1</div>
    <div class="item">Kolom 2</div>
    <div class="item">Kolom 3</div>
  </div>
</body>
</html>
